<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEE · 个人名片</title>
<style>
  :root {
    /* 像素风日间配色 - 复古游戏卡带感 */
    --bg-primary: #EADFC9;
    --bg-checker-1: #E5D9C2;
    --bg-checker-2: #DFD2B7;
    --bg-card: #FFF8E7;
    --bg-left: #F5EDD9;
    --text-primary: #3B2A1A;
    --text-secondary: #6B5740;
    --accent: #5FB8B5;
    --accent-dark: #3F8F8C;
    --accent-darker: #2C6E6B;
    --tag-bg: #D6ECEA;
    --tag-text: #2C6E6B;
    --pixel-border-dark: #3B2A1A;
    --pixel-border-mid: #8B7355;
    --pixel-shadow-1: #3B2A1A;
    --pixel-shadow-2: rgba(59, 42, 26, 0.35);
    /* 天空配色 - 日间晴空 */
    --sky-top: #6EC6F0;
    --sky-mid: #9EDCF5;
    --sky-bottom: #D4EFFA;
    --cloud-color: #FFFFFF;
    --cloud-shade: #E0E8F0;
    /* 太阳 / 鸟 */
    --sun-core: #FFD54A;
    --sun-ray: #FFB84A;
    --sun-glow: rgba(255, 213, 74, 0.35);
    --bird-color: #2C2C2C;
    /* 人物配色 - 黑色卷发 + 黑色长裙 */
    --hair: #2D2438;
    --hair-hl: #5A4868;
    --skin: #F5D0A9;
    --skin-shade: #E0B48C;
    --cheek: #F0A080;
    --eye: #2A1F14;
    --dress: #14141F;
    --dress-dk: #08080F;
    --shoe: #3B2A1A;
    /* 状态色 */
    --status-online: #5AD878;
    /* 血条色 */
    --bar-vigor: #E8B04A;
    --bar-patience: #5A8FE8;
    --bar-curiosity: #A85AD8;
    --bar-energy: #5AD878;
    --bar-bg: #3B2A1A;
  }

  [data-theme="dark"] {
    /* 像素风夜间配色 - 星夜下的像素小镇 */
    --bg-primary: #1F1B2E;
    --bg-checker-1: #231F35;
    --bg-checker-2: #2A2540;
    --bg-card: #2E2845;
    --bg-left: #252039;
    --text-primary: #F0E8D0;
    --text-secondary: #B0A88C;
    --accent: #7DD3D0;
    --accent-dark: #5FB8B5;
    --accent-darker: #4A9B98;
    --tag-bg: #3A4560;
    --tag-text: #A8E5E2;
    --pixel-border-dark: #0F0D1A;
    --pixel-border-mid: #5A5080;
    --pixel-shadow-1: #0F0D1A;
    --pixel-shadow-2: rgba(0, 0, 0, 0.5);
    /* 天空配色 - 夜间星空 */
    --sky-top: #0A0820;
    --sky-mid: #14102E;
    --sky-bottom: #1F1B3E;
    --cloud-color: #3A3550;
    --cloud-shade: #2A2540;
    /* 月亮 */
    --moon-color: #F0E8C0;
    --moon-shade: #C8B88C;
    --moon-crater: #B0A878;
    /* 人物配色 - 黑色卷发 + 黑色长裙 */
    --skin: #D4A87C;
    --skin-shade: #B08860;
    --cheek: #C06080;
    --eye: #101020;
    --shoe: #1A1428;
    --bar-bg: #0F0D1A;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  body {
    font-family: "Courier New", "Consolas", "PingFang SC", "Microsoft YaHei", monospace;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.4s steps(6), color 0.3s steps(4);
    position: relative;
    overflow-x: hidden;
  }

  /* 天空容器 - 固定全屏背景层 */
  .sky {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* 像素云朵 - 用 box-shadow 拼出像素云（更大版：12px 每像素） */
  .cloud-track {
    position: absolute;
    left: 0;
    will-change: transform;
    animation: drift-right linear infinite;
  }

  .cloud {
    width: 12px;
    height: 12px;
    background: transparent;
    position: relative;
  }

  /* 中型云 (8宽x5高像素) - 放大到 ~108x72px */
  .cloud-md {
    box-shadow:
      24px 0 0 var(--cloud-color),
      36px 0 0 var(--cloud-color),
      48px 0 0 var(--cloud-color),
      60px 0 0 var(--cloud-color),
      0 12px 0 var(--cloud-color),
      12px 12px 0 var(--cloud-color),
      24px 12px 0 var(--cloud-color),
      36px 12px 0 var(--cloud-color),
      48px 12px 0 var(--cloud-color),
      60px 12px 0 var(--cloud-color),
      72px 12px 0 var(--cloud-color),
      0 24px 0 var(--cloud-color),
      12px 24px 0 var(--cloud-color),
      24px 24px 0 var(--cloud-color),
      36px 24px 0 var(--cloud-shade),
      48px 24px 0 var(--cloud-shade),
      60px 24px 0 var(--cloud-color),
      72px 24px 0 var(--cloud-color),
      84px 24px 0 var(--cloud-color),
      12px 36px 0 var(--cloud-color),
      24px 36px 0 var(--cloud-color),
      36px 36px 0 var(--cloud-shade),
      48px 36px 0 var(--cloud-shade),
      60px 36px 0 var(--cloud-color),
      72px 36px 0 var(--cloud-color),
      24px 48px 0 var(--cloud-color),
      36px 48px 0 var(--cloud-color),
      48px 48px 0 var(--cloud-color),
      60px 48px 0 var(--cloud-color);
  }

  /* 大型云 (11宽x6高像素) - 放大到 ~156x84px */
  .cloud-lg {
    box-shadow:
      36px 0 0 var(--cloud-color),
      48px 0 0 var(--cloud-color),
      60px 0 0 var(--cloud-color),
      72px 0 0 var(--cloud-color),
      24px 12px 0 var(--cloud-color),
      36px 12px 0 var(--cloud-color),
      48px 12px 0 var(--cloud-color),
      60px 12px 0 var(--cloud-color),
      72px 12px 0 var(--cloud-color),
      84px 12px 0 var(--cloud-color),
      0 24px 0 var(--cloud-color),
      12px 24px 0 var(--cloud-color),
      24px 24px 0 var(--cloud-color),
      36px 24px 0 var(--cloud-color),
      48px 24px 0 var(--cloud-color),
      60px 24px 0 var(--cloud-shade),
      72px 24px 0 var(--cloud-shade),
      84px 24px 0 var(--cloud-color),
      96px 24px 0 var(--cloud-color),
      108px 24px 0 var(--cloud-color),
      120px 24px 0 var(--cloud-color),
      0 36px 0 var(--cloud-color),
      12px 36px 0 var(--cloud-color),
      24px 36px 0 var(--cloud-color),
      36px 36px 0 var(--cloud-color),
      48px 36px 0 var(--cloud-color),
      60px 36px 0 var(--cloud-color),
      72px 36px 0 var(--cloud-color),
      84px 36px 0 var(--cloud-color),
      96px 36px 0 var(--cloud-color),
      108px 36px 0 var(--cloud-color),
      120px 36px 0 var(--cloud-color),
      12px 48px 0 var(--cloud-color),
      24px 48px 0 var(--cloud-color),
      36px 48px 0 var(--cloud-color),
      48px 48px 0 var(--cloud-shade),
      60px 48px 0 var(--cloud-shade),
      72px 48px 0 var(--cloud-color),
      84px 48px 0 var(--cloud-color),
      96px 48px 0 var(--cloud-color),
      108px 48px 0 var(--cloud-color),
      24px 60px 0 var(--cloud-color),
      36px 60px 0 var(--cloud-shade),
      48px 60px 0 var(--cloud-color),
      60px 60px 0 var(--cloud-color),
      72px 60px 0 var(--cloud-color),
      84px 60px 0 var(--cloud-shade),
      96px 60px 0 var(--cloud-color);
  }

  /* 小型云 (6宽x4高像素) - ~84x60px */
  .cloud-sm {
    box-shadow:
      12px 0 0 var(--cloud-color),
      24px 0 0 var(--cloud-color),
      36px 0 0 var(--cloud-color),
      0 12px 0 var(--cloud-color),
      12px 12px 0 var(--cloud-color),
      24px 12px 0 var(--cloud-shade),
      36px 12px 0 var(--cloud-color),
      48px 12px 0 var(--cloud-color),
      60px 12px 0 var(--cloud-color),
      0 24px 0 var(--cloud-color),
      12px 24px 0 var(--cloud-color),
      24px 24px 0 var(--cloud-color),
      36px 24px 0 var(--cloud-color),
      48px 24px 0 var(--cloud-color),
      60px 24px 0 var(--cloud-color),
      12px 36px 0 var(--cloud-color),
      24px 36px 0 var(--cloud-color),
      36px 36px 0 var(--cloud-color),
      48px 36px 0 var(--cloud-color);
  }

  @keyframes drift-right {
    from { transform: translateX(-320px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* ===== 太阳（日间） ===== */
  .sun {
    position: fixed;
    top: 5%;
    right: 7%;
    width: 96px;
    height: 96px;
    z-index: 0;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s steps(6);
  }
  [data-theme="dark"] .sun { opacity: 0; }

  .sun-glow {
    position: absolute;
    top: -24px; left: -24px;
    width: 144px;
    height: 144px;
    border-radius: 0;
    background: var(--sun-glow);
    filter: blur(12px);
  }

  /* 像素太阳：7x7核心 + 周围像素射线，每个像素12px */
  .sun-body {
    position: absolute;
    top: 0; left: 0;
    width: 12px;
    height: 12px;
    background: transparent;
    /* 像素太阳模型：8个方向射线 + 圆形核心 7x7 */
    box-shadow:
      /* 射线（上下左右+4对角） */
      48px -24px 0 var(--sun-ray),
      0 48px 0 var(--sun-ray),
      84px 48px 0 var(--sun-ray),
      48px 108px 0 var(--sun-ray),
      -12px 72px 0 var(--sun-ray),
      108px 72px 0 var(--sun-ray),
      -12px 24px 0 var(--sun-ray),
      108px 24px 0 var(--sun-ray),
      /* 核心 Row 0 */
      36px 12px 0 var(--sun-core),
      48px 12px 0 var(--sun-core),
      60px 12px 0 var(--sun-core),
      /* 核心 Row 1 */
      24px 24px 0 var(--sun-core),
      36px 24px 0 var(--sun-core),
      48px 24px 0 var(--sun-ray),
      60px 24px 0 var(--sun-core),
      72px 24px 0 var(--sun-core),
      /* 核心 Row 2 */
      12px 36px 0 var(--sun-core),
      24px 36px 0 var(--sun-core),
      36px 36px 0 var(--sun-core),
      48px 36px 0 var(--sun-core),
      60px 36px 0 var(--sun-core),
      72px 36px 0 var(--sun-core),
      84px 36px 0 var(--sun-core),
      /* 核心 Row 3 */
      12px 48px 0 var(--sun-ray),
      24px 48px 0 var(--sun-core),
      36px 48px 0 var(--sun-core),
      48px 48px 0 var(--sun-core),
      60px 48px 0 var(--sun-core),
      72px 48px 0 var(--sun-core),
      84px 48px 0 var(--sun-ray),
      /* 核心 Row 4 */
      12px 60px 0 var(--sun-core),
      24px 60px 0 var(--sun-core),
      36px 60px 0 var(--sun-core),
      48px 60px 0 var(--sun-core),
      60px 60px 0 var(--sun-core),
      72px 60px 0 var(--sun-core),
      84px 60px 0 var(--sun-core),
      /* 核心 Row 5 */
      24px 72px 0 var(--sun-core),
      36px 72px 0 var(--sun-core),
      48px 72px 0 var(--sun-ray),
      60px 72px 0 var(--sun-core),
      72px 72px 0 var(--sun-core),
      /* 核心 Row 6 */
      36px 84px 0 var(--sun-core),
      48px 84px 0 var(--sun-core),
      60px 84px 0 var(--sun-core);
  }

  /* ===== 月亮（夜间） ===== */
  .moon {
    position: fixed;
    top: 6%;
    right: 8%;
    width: 12px;
    height: 12px;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s steps(6);
  }
  [data-theme="dark"] .moon { opacity: 1; }

  /* 像素月牙（7x8带阴影 + 2个陨石坑）每像素12px */
  .moon-body {
    position: absolute;
    width: 12px;
    height: 12px;
    background: transparent;
    box-shadow:
      /* Row 0 - 顶部 */
      24px 0 0 var(--moon-color),
      36px 0 0 var(--moon-color),
      /* Row 1 */
      12px 12px 0 var(--moon-color),
      24px 12px 0 var(--moon-color),
      36px 12px 0 var(--moon-color),
      48px 12px 0 var(--moon-color),
      /* Row 2 */
      0 24px 0 var(--moon-color),
      12px 24px 0 var(--moon-color),
      24px 24px 0 var(--moon-color),
      36px 24px 0 var(--moon-color),
      48px 24px 0 var(--moon-shade),
      /* Row 3 */
      0 36px 0 var(--moon-color),
      12px 36px 0 var(--moon-crater),
      24px 36px 0 var(--moon-color),
      36px 36px 0 var(--moon-color),
      48px 36px 0 var(--moon-shade),
      /* Row 4 */
      0 48px 0 var(--moon-color),
      12px 48px 0 var(--moon-color),
      24px 48px 0 var(--moon-color),
      36px 48px 0 var(--moon-crater),
      48px 48px 0 var(--moon-shade),
      /* Row 5 */
      0 60px 0 var(--moon-color),
      12px 60px 0 var(--moon-color),
      24px 60px 0 var(--moon-color),
      36px 60px 0 var(--moon-color),
      48px 60px 0 var(--moon-shade),
      /* Row 6 */
      12px 72px 0 var(--moon-color),
      24px 72px 0 var(--moon-color),
      36px 72px 0 var(--moon-shade),
      48px 72px 0 var(--moon-shade),
      /* Row 7 */
      24px 84px 0 var(--moon-color),
      36px 84px 0 var(--moon-shade);
  }

  /* ===== 飞鸟（日间）===== */
  .birds {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s steps(6);
  }
  [data-theme="dark"] .birds { opacity: 0; }

  .bird-track {
    position: absolute;
    left: -120px;
    animation: bird-right linear infinite;
    will-change: transform;
  }

  .bird {
    width: 6px;
    height: 6px;
    background: transparent;
    position: relative;
    animation: flap 0.5s steps(2) infinite;
  }

  /* 像素鸟 - 翅膀张开状态（5宽x3高，每像素6px） */
  .bird.frame-a {
    box-shadow:
      0 0 0 var(--bird-color),
      6px 6px 0 var(--bird-color),
      12px 6px 0 var(--bird-color),
      18px 6px 0 var(--bird-color),
      24px 0 0 var(--bird-color),
      12px 12px 0 var(--bird-color);
  }
  .bird.frame-b {
    box-shadow:
      0 6px 0 var(--bird-color),
      6px 0 0 var(--bird-color),
      12px 0 0 var(--bird-color),
      18px 0 0 var(--bird-color),
      24px 6px 0 var(--bird-color),
      12px 6px 0 var(--bird-color);
  }

  @keyframes flap {
    0%, 50%  { transform: translateY(0); }
    50.01%, 100% { transform: translateY(2px); }
  }
  @keyframes bird-right {
    0%   { transform: translateX(-80px) translateY(0); }
    30%  { transform: translateX(40vw) translateY(-18px); }
    60%  { transform: translateX(70vw) translateY(10px); }
    100% { transform: translateX(calc(100vw + 80px)) translateY(-10px); }
  }

  /* ===== 夜间星空（像素星点+闪烁）===== */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 70%;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.5s steps(6);
  }
  [data-theme="dark"] .stars { opacity: 1; }

  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #FFF8D8;
    animation: twinkle steps(2) infinite;
  }
  .star.small { width: 2px; height: 2px; background: #D4C898; }

  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* 横向卡片布局 */
  .card {
    background: var(--bg-card);
    max-width: 780px;
    width: 100%;
    position: relative;
    z-index: 1;
    display: flex;
    border: 4px solid var(--pixel-border-dark);
    box-shadow:
      8px 8px 0 var(--pixel-shadow-1),
      inset 0 0 0 2px var(--bg-card),
      inset 0 0 0 4px var(--pixel-border-mid);
    transition: background-color 0.3s steps(4), border-color 0.3s steps(4);
    overflow: hidden;
  }

  /* 左侧 - 人物区 */
  .card-left {
    flex: 0 0 260px;
    background: var(--bg-left);
    border-right: 4px solid var(--pixel-border-dark);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background-color 0.3s steps(4), border-color 0.3s steps(4);
  }

  /* 状态徽章 - 类似钉钉在线状态 */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 2px solid var(--pixel-border-dark);
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 2px 2px 0 var(--pixel-shadow-2);
    margin-bottom: 16px;
    transition: background-color 0.3s steps(4), color 0.3s steps(4);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--status-online);
    border: 1px solid var(--pixel-border-dark);
    animation: blink 1.2s steps(2) infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 像素人物 - 卷发黑长裙女生 */
  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .pixel-character {
    position: relative;
    width: 144px;
    height: 168px;
    /* 12列 x 14行 像素格，每格12px */
    --p: 12px;
  }

  .pixel-character .px {
    position: absolute;
    width: var(--p);
    height: var(--p);
    left: calc(var(--p) * var(--x));
    top: calc(var(--p) * var(--y));
  }

  /* 头发 - 黑色卷发 */
  .px.hr { background: var(--hair); }
  .px.hl { background: var(--hair-hl); }
  /* 皮肤 */
  .px.sk { background: var(--skin); }
  .px.ss { background: var(--skin-shade); }
  /* 眼睛 */
  .px.ey { background: var(--eye); }
  /* 腮红 */
  .px.ck { background: var(--cheek); }
  /* 黑色长裙 */
  .px.dr { background: var(--dress); }
  .px.dd { background: var(--dress-dk); }
  /* 鞋子 */
  .px.sr { background: var(--shoe); }

  /* 等级条 - 像素游戏角色等级 */
  .level-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .lv-badge {
    flex-shrink: 0;
    background: var(--bar-vigor);
    color: var(--pixel-border-dark);
    border: 2px solid var(--pixel-border-dark);
    box-shadow: 2px 2px 0 var(--pixel-shadow-2);
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .exp-bar {
    flex: 1;
    height: 12px;
    background: var(--bar-bg);
    border: 2px solid var(--pixel-border-dark);
    box-shadow: 2px 2px 0 var(--pixel-shadow-2);
    position: relative;
    overflow: hidden;
  }
  .exp-fill {
    height: 100%;
    width: 72%;
    background: linear-gradient(90deg, var(--bar-vigor) 0%, #F0C86A 100%);
    position: relative;
  }
  .exp-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 7px,
      rgba(0,0,0,0.3) 7px,
      rgba(0,0,0,0.3) 9px
    );
  }

  /* 血条区 - 像素游戏风格 */
  .stat-bars {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 1px;
    width: 42px;
    text-align: right;
    transition: color 0.3s steps(4);
  }
  .bar {
    flex: 1;
    height: 12px;
    background: var(--bar-bg);
    border: 2px solid var(--pixel-border-dark);
    box-shadow: 2px 2px 0 var(--pixel-shadow-2);
    position: relative;
    overflow: hidden;
    transition: background-color 0.3s steps(4), border-color 0.3s steps(4);
  }
  .bar-fill {
    height: 100%;
    position: relative;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 7px,

  .gallery-overlay {
    position: fixed;

    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
  }
  .gallery-overlay.active {
    display: flex;
  }
  .gallery-title {
    color: #FFF8E7;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 16px;
    text-shadow: 2px 2px 0 var(--accent-dark);
  }
  .gallery-frame {
    position: relative;
    max-width: 700px;
    width: 100%;
    height: 60vh;
    background: #1A1A2E;
    border: 4px solid #FFF8E7;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

  .gallery-frame img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: auto;
  }
  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    background: var(--accent);
    color: #1A1A2E;
    border: 3px solid #FFF8E7;

    align-items: center;

  .gallery-next { right: -12px; }

    color: #FFF8E7;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;

    top: 16px;

    height: 40px;

    display: flex;
    align-items: center;

<script>
  (function() {
    const btn = document.getElementById('themeBtn');
    const html = document.documentElement;
    const statusText = document.getElementById('statusText');
    const copyBtn = document.getElementById('copyBtn');
    const emailAddr = document.getElementById('emailAddr');
    let copyTimer = null;

    function updateButton() {
      const isDark = html.getAttribute('data-theme') === 'dark';
      btn.textContent = isDark ? '[ 切换到日间模式 ]' : '[ 切换到夜间模式 ]';
      if (statusText) {
        statusText.textContent = isDark ? '休息中...' : '学习中...';
      }
    }

    btn.addEventListener('click', function() {
      const current = html.getAttribute('data-theme');
      if (current === 'dark') {
        html.removeAttribute('data-theme');
      } else {
        html.setAttribute('data-theme', 'dark');
      }
      updateButton();
    });

    // 复制邮箱按钮
    if (copyBtn && emailAddr) {
      copyBtn.addEventListener('click', async function() {
        const email = emailAddr.textContent.trim();
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(email);
            ok = true;
          } else {
            // 兼容：创建隐藏 textarea + execCommand
            const ta = document.createElement('textarea');
            ta.value = email;
            ta.setAttribute('readonly', '');
            ta.style.position = 'absolute';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          }
        } catch (e) {
          ok = false;
        }

        if (ok) {
          const original = copyBtn.textContent;
          copyBtn.textContent = '已复制 ✓';
          copyBtn.classList.add('copied');
          if (copyTimer) clearTimeout(copyTimer);
          copyTimer = setTimeout(function() {
            copyBtn.textContent = original;
            copyBtn.classList.remove('copied');
          }, 1500);
        } else {
          copyBtn.textContent = '复制失败';
          if (copyTimer) clearTimeout(copyTimer);
          copyTimer = setTimeout(function() {
            copyBtn.textContent = '复制';
          }, 1500);
        }
      });
    }

    updateButton();
  })();
</script>

    var overlay = document.getElementById('galleryOverlay');
    var imgEl = document.getElementById('galleryImg');
    var titleEl = document.getElementById('galleryTitle');
    var counterEl = document.getElementById('galleryCounter');
    var prevBtn = document.getElementById('galleryPrev');
    var nextBtn = document.getElementById('galleryNext');
    var closeBtn = document.getElementById('galleryClose');

    var currentImages = [];
    var currentIndex = 0;
    var titleText = '';

    function showGallery(images, title) {
      currentImages = images;
      titleText = title;
      currentIndex = 0;
      updateImage();
      overlay.classList.add('active');
    }

    function updateImage() {
      imgEl.src = currentImages[currentIndex];
      titleEl.textContent = titleText;
      counterEl.textContent = (currentIndex + 1) + ' / ' + currentImages.length;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateImage();
    }

    function closeGallery() {
      overlay.classList.remove('active');
    }

    nextBtn.addEventListener('click', nextImage);
    prevBtn.addEventListener('click', prevImage);
    closeBtn.addEventListener('click', closeGallery);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeGallery();
    });

    document.addEventListener('keydown', function(e) {
      if (!overlay.classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextImage();
      else if (e.key === 'ArrowLeft') prevImage();
      else if (e.key === 'Escape') closeGallery();
    });

    document.getElementById('galleryNature').addEventListener('click', function() {
      showGallery(natureImages, '>> 自然摄影');
    });
    document.getElementById('galleryMusic').addEventListener('click', function() {
      showGallery(musicImages, '>> 音乐欣赏');
    });
  })();
</script>
